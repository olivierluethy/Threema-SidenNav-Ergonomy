<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Menu Extension</title>
    <script src="script.js" defer></script>
    <style>
        /* Allgemeine Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: white;
            color: #fff;
            width: 300px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container für das Popup */
        .popup-container {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background-color: gray;
            width: 100%;
            height: 100%;
        }

        /* Das animierte Logo */
        .logo {
            margin-left: auto;
            margin-right: auto;
            margin-top: 10%;
            width: 80px;
            height: 80px;
            background-image: url('icons/logo.png'); /* Ersetze mit deinem Logo */
            background-size: cover;
            background-position: center;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        /* Animation für das Schwebende Logo */
        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
            100% {
                transform: translateY(0);
            }
        }

        /* Der Spenden-Button */
        .donate-button {
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 30px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        /* Hover-Effekt für den Spenden-Button */
        .donate-button:hover {
            background-color: #e64a19;
        }

        /* Der Text für den Spenden-Button */
        .donate-text {
            font-size: 14px;
            margin-top: 15px;
            color: #ccc;
        }

        /* Einfache Animation für das Popup */
        .popup-container {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="logo"></div> <!-- Hier wird das animierte Logo angezeigt -->
        <h2>Danke für deine Unterstützung!</h2>
        <p class="donate-text">Unterstütze uns mit einer kleinen Spende.</p>
        <button class="donate-button" id="donateButton">Spenden</button>
    </div>
</body>
</html>
